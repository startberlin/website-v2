name: Deploy PR preview

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Open PR number (an admin must inspect the diff before requesting a preview)
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  guard:
    if: vars.DEPLOYMENTS_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      branch: ${{ steps.select.outputs.branch }}
      tree: ${{ steps.select.outputs.tree }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - run: node scripts/release/verify-github.mjs pr-preview
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request }}
  deploy:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: pr-preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/vercel
      - run: node scripts/release/preview-config.mjs
      - name: Verify that PR previews have no shared service credentials
        run: node scripts/release/verify-vercel.mjs pr-preview
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Check out the exact selected PR commit in a separate directory
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.guard.outputs.sha }}
          path: .astro/preview-source
          persist-credentials: false
      - name: Build an isolated PR preview (source executes only on Vercel)
        id: deploy
        run: |
          url=$("$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel" deploy --cwd .astro/preview-source --target=preview --yes --scope=start-berlin --non-interactive \
            --local-config="$GITHUB_WORKSPACE/.astro/vercel-preview.json" \
            --meta githubDeployment=1 --meta githubCommitRef="$PR_BRANCH" --meta githubCommitSha="$PR_SHA" \
            --build-env RELEASE_COMMIT_SHA="$PR_SHA" --build-env RELEASE_TREE_SHA="$PR_TREE")
          [[ "$url" =~ ^https://[a-zA-Z0-9-]+\.vercel\.app$ ]]
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          PR_BRANCH: ${{ needs.guard.outputs.branch }}
          PR_SHA: ${{ needs.guard.outputs.sha }}
          PR_TREE: ${{ needs.guard.outputs.tree }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Check pages, indexing and exact preview source
        run: node scripts/release/smoke.mjs
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          RELEASE_COMMIT_SHA: ${{ needs.guard.outputs.sha }}
          RELEASE_TREE_SHA: ${{ needs.guard.outputs.tree }}
          SMOKE_PREVIEW: 'true'
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
