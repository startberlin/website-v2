name: Open release PR

on:
  workflow_run:
    workflows: [Deploy staging]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: website-release-pr
  cancel-in-progress: false

jobs:
  open:
    if: vars.DEPLOYMENTS_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event) && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - name: Require a completed staging deployment, including its domain verification
        run: |
          node --input-type=module -e 'import {verifyStagingRun} from "./scripts/release/verify-github.mjs"; await verifyStagingRun(process.env.STAGING_RUN_ID, process.env.STAGED_SHA);'
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ github.event.workflow_run.id }}
          STAGED_SHA: ${{ github.event.workflow_run.head_sha }}
      - name: Open or update main-to-production PR after successful staging
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$latest" != "$STAGED_SHA" ]; then
            echo 'A newer main commit must finish staging first.'
            exit 0
          fi
          body="$RUNNER_TEMP/website-release.md"
          cat > "$body" <<EOF
          Release the staged main source: $STAGED_SHA.

          Staging: https://staging.start-berlin.com
          Verification: $STAGING_RUN_URL

          One repository admin authorizes the latest commit by review or intentional merge, including on their own PR. Technical checks and resolved discussions still apply. If GitHub shows an "Approve workflows to run" banner for this bot-created PR, approve CI and wait for Required checks.

          Before merging, complete docs/RELEASE.md acceptance, including backend and external form checks. A staging 503 is a controlled preview state, not Jobboard acceptance. Merging only deploys when PRODUCTION_RELEASE_ENABLED is explicitly enabled.
          EOF
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --base production --head main --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base production --head main --title 'Release reviewed website to production' --body-file "$body"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          STAGED_SHA: ${{ github.event.workflow_run.head_sha }}
          STAGING_RUN_URL: ${{ github.event.workflow_run.html_url }}
