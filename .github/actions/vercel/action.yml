name: Install reviewed Vercel CLI
description: Install outside the checkout, before any credential is exposed.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: package.json
    - shell: bash
      run: |
        npm install --prefix "$RUNNER_TEMP/vercel-cli" --no-audit --no-fund vercel@63.1.2
        echo "VERCEL_CLI=$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel" >> "$GITHUB_ENV"
